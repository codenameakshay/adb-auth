name: Release (macOS)

on:
  push:
    tags:
      - 'macos-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (example: macos-v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Check Swift version
        run: swift --version

      - name: Build and package app
        run: |
          VERSION="${RELEASE_TAG#macos-v}"
          cd macos/ADBBuddyNotch
          swift build --configuration release
          BIN=$(swift build --configuration release --show-bin-path)

          APP_NAME="ADBBuddyNotch.app"
          APP_DIR="$APP_NAME/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"

          if [ ! -f "$BIN/ADBBuddyNotchApp" ]; then
            echo "::error::built binary not found at $BIN/ADBBuddyNotchApp"
            exit 1
          fi
          cp "$BIN/ADBBuddyNotchApp" "$APP_DIR/MacOS/"

          # Bundle.module's generated accessor looks for the resource
          # bundle at Bundle.main.resourceURL, which resolves to
          # Contents/Resources once the binary runs inside a real .app.
          BUNDLE_NAME="ADBBuddyNotch_ADBBuddyNotchApp.bundle"
          if [ ! -d "$BIN/$BUNDLE_NAME" ]; then
            echo "::error::resource bundle not found at $BIN/$BUNDLE_NAME"
            exit 1
          fi
          cp -R "$BIN/$BUNDLE_NAME" "$APP_DIR/Resources/"

          cat > "$APP_DIR/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ADBBuddyNotchApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.adbbuddynotch.app</string>
              <key>CFBundleName</key>
              <string>ADB Buddy Notch</string>
              <key>CFBundleDisplayName</key>
              <string>ADB Buddy Notch</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          ZIP_NAME="ADBBuddyNotch-$VERSION.zip"
          zip -r "$ZIP_NAME" "$APP_NAME"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-buddy-notch-app
          path: macos/ADBBuddyNotch/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: macos-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: adb-buddy-notch-app
          path: release-artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-artifacts/*.zip
