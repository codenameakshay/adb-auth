name: Release (macOS)

on:
  push:
    tags:
      - 'macos-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (example: macos-v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Check Swift version
        run: swift --version

      - name: Build and package app
        run: macos/ADBBuddyNotch/package-app.sh "${RELEASE_TAG#macos-v}"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-buddy-notch-app
          path: macos/ADBBuddyNotch/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: macos-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: adb-buddy-notch-app
          path: release-artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-artifacts/*.zip
